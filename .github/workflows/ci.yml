name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Testes · Config de build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test -- --ci

      # 🔴 Gate do SM-017. `src/shared/services/config/env.ts` já recusa http://
      # fora de development, mas recusa NO APARELHO — tarde demais se o binário
      # já foi publicado. Este passo faz a mesma pergunta antes do build.
      - name: Configuração de build (EAS)
        run: npm run check:eas-env

  # NOTA — não há passo de lint. O repositório não tem configuração de ESLint
  # (nenhum .eslintrc / eslint.config.*), e introduzir uma junto com o CI
  # significaria estrear o gate com centenas de achados de estilo, que é o
  # cenário que faz um time desligar o CI. Fica como tarefa própria: adicionar
  # `eslint-config-expo`, rodar --fix, e só então acrescentar o passo aqui —
  # exatamente a sequência usada no backend, onde 39 erros acumulados foram
  # limpos ANTES de o gate existir.
  #
  # NOTA — não há passo de build. Build de app React Native é `eas build`, que
  # roda na infraestrutura da Expo, consome cota e precisa de credenciais de
  # assinatura. Typecheck + testes + guarda de configuração cobrem o que é
  # verificável de graça a cada PR; o build continua sendo disparado à mão pelos
  # scripts `build:android:*` / `build:ios:*`.
