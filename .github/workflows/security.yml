name: Segurança

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencias:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Allowlist com motivo e prazo em scripts/npm-audit-allowlist.json — num
      # projeto Expo a maior parte dos avisos "de produção" é da cadeia do
      # bundler e não vai no APK. Ver o cabeçalho de scripts/audit-gate.mjs.
      - name: Gate de auditoria
        run: npm run audit:gate

      - name: Gerar SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-mobile-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mesmo escopo do backend: os commits DESTE push/PR. O que previne
      # vazamento novo é barrar o commit que o traz; reexaminar o histórico
      # inteiro a cada execução só repete achado já conhecido.
      #
      # Atenção específica deste repositório: `google-services.json` é rastreado
      # e contém uma chave `AIza...`. Ela é a chave de cliente do Firebase, que
      # por desenho viaja dentro de todo APK — não é segredo, e a proteção certa
      # é restrição de chave no Google Cloud Console, não removê-la do git. Se o
      # gitleaks passar a apontá-la, a resposta é uma entrada em .gitleaksignore
      # com esta justificativa, não rotação.
      - name: Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ARGS=(detect --source=/repo --redact --verbose --exit-code=1)

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            ARGS+=(--log-opts="$BASE_SHA..$HEAD_SHA")
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] \
               && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            ARGS+=(--log-opts="$BEFORE_SHA..$HEAD_SHA")
          else
            ARGS+=(--no-git)
          fi

          echo "Escopo: ${ARGS[*]}"
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest "${ARGS[@]}"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
